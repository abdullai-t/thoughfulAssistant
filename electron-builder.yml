appId: com.interview-overlay.app
productName: InterviewOverlay
copyright: Copyright © 2024
directories:
  output: release
  buildResources: assets
npmRebuild: false
extraResources:
  - from: eng.traineddata
    to: ocr/eng.traineddata
files:
  - out/**/*
win:
  # Separate from the Mac dmg/zip names produced by scripts/package-mac.js.
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/app-icon.ico
  extraResources:
    # node-gyp writes the Electron addon to build/Release, which is also
    # where the unpackaged app loads it from.
    - from: build/Release/
      to: native/
      filter:
        - "*.node"
mac:
  minimumSystemVersion: '13.0'
  extraResources:
    - from: build/mac/overlay-audio
      to: native/overlay-audio
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.productivity
  extendInfo:
    NSMicrophoneUsageDescription: InterviewOverlay uses microphone audio for transcription.
    NSScreenCaptureUsageDescription: InterviewOverlay captures the screen when you request OCR context.
    NSSpeechRecognitionUsageDescription: InterviewOverlay transcribes audio on this Mac when you select local speech recognition.
    NSAudioCaptureUsageDescription: InterviewOverlay captures system audio when you enable System audio and start recording.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
